plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.tepcoenergy.airalarm'
    compileSdk 34

    defaultConfig {
        applicationId "com.tepcoenergy.airalarm"
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName "3.0"
    }

    signingConfigs {
        release {
            def ksFile = file("tepco-release.jks")
            if (ksFile.exists()) {
                storeFile ksFile
                storePassword "TepcoEnergy2026!"
                keyAlias "tepco_key"
                keyPassword "TepcoEnergy2026!"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (file("tepco-release.jks").exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
}
