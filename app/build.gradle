plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def ciSigning = providers.gradleProperty('android.injected.signing.store.file').isPresent()
def localStorePath = providers.environmentVariable('RELEASE_STORE_FILE').getOrElse('tepco-release.jks')
def localStoreFile = file(localStorePath)
def localStorePassword = providers.environmentVariable('RELEASE_STORE_PASSWORD').orNull
def localKeyAlias = providers.environmentVariable('RELEASE_KEY_ALIAS').getOrElse('tepco_key')
def localKeyPassword = providers.environmentVariable('RELEASE_KEY_PASSWORD').orNull
def localSigning = !ciSigning && localStoreFile.isFile() && localStorePassword && localKeyAlias && localKeyPassword

android {
    namespace 'com.tepcoenergy.airalarm'
    compileSdk 34

    defaultConfig {
        applicationId "com.tepcoenergy.airalarm"
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName "3.0"
    }

    signingConfigs {
        release {
            if (localSigning) {
                storeFile localStoreFile
                storePassword localStorePassword
                keyAlias localKeyAlias
                keyPassword localKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (localSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
}
