name: Build TEPCO Air Signed Release APK v4.1

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Release Keystore for Toka Energy Pars
        run: |
          keytool -genkeypair -v -keystore app/tepco-release.jks -keyalg RSA -keysize 2048 -validity 10000 -alias tepco_key -storepass "TepcoEnergy2026!" -keypass "TepcoEnergy2026!" -dname "CN=Toka Energy Pars, OU=Engineering, O=TEPCO, L=Tehran, S=Tehran, C=IR"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'
          cache-disabled: true

      - name: Build and Sign Release APK
        run: |
          gradle assembleRelease
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          if [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            $BUILD_TOOLS/zipalign -v -p 4 app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/app-release-aligned.apk
            $BUILD_TOOLS/apksigner sign --ks app/tepco-release.jks --ks-key-alias tepco_key --ks-pass pass:"TepcoEnergy2026!" --key-pass pass:"TepcoEnergy2026!" --out app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/app-release-aligned.apk
          fi
          $BUILD_TOOLS/apksigner verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Tehran-Air-TEPCO-Signed-APK-v4.1
          path: app/build/outputs/apk/release/app-release.apk
