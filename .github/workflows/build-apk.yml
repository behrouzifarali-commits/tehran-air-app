name: Build TEPCO Air Signed Release APK v4.1

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Generate Release Keystore for Toka Energy Pars
        run: |
          keytool -genkeypair -v -keystore app/tepco-release.jks -keyalg RSA -keysize 2048 -validity 10000 -alias tepco_key -storepass "TepcoEnergy2026!" -keypass "TepcoEnergy2026!" -dname "CN=Toka Energy Pars, OU=Engineering, O=TEPCO, L=Tehran, S=Tehran, C=IR"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'
      - name: Build Signed Release APK
        run: gradle assembleRelease
      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Tehran-Air-TEPCO-Release-APK-v4.1
          path: app/build/outputs/apk/release/app-release.apk
