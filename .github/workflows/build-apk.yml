name: Build TEPCO Air APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.2'
          cache-disabled: true
      - name: Check Android sources
        run: |
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/res/layout/activity_main.xml
      - name: Build and verify APK
        id: apk
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          for name in RELEASE_KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            echo "::notice::Building a test APK. Missing release signing secrets: ${missing[*]}"
            gradle --no-daemon :app:assembleDebug
            echo "path=app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_OUTPUT"
            echo "artifact=Tehran-Air-TEPCO-Test-APK" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          umask 077
          keystore="$(mktemp "$RUNNER_TEMP/tepco-release.XXXXXXXX.jks")"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          unset RELEASE_KEYSTORE_BASE64

          gradle --no-daemon :app:assembleRelease \
            "-Pandroid.injected.signing.store.file=$keystore" \
            "-Pandroid.injected.signing.store.password=$RELEASE_STORE_PASSWORD" \
            "-Pandroid.injected.signing.key.alias=$RELEASE_KEY_ALIAS" \
            "-Pandroid.injected.signing.key.password=$RELEASE_KEY_PASSWORD"

          sdk_dir="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          apksigner="$(find "${sdk_dir:?Android SDK path is missing}/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -x "$apksigner"
          "$apksigner" verify app/build/outputs/apk/release/app-release.apk
          echo "path=app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_OUTPUT"
          echo "artifact=Tehran-Air-TEPCO-Release-APK-v3" >> "$GITHUB_OUTPUT"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.artifact }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
