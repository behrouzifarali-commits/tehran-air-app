name: Build TEPCO Air Signed Release APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'
      - name: Build and verify signed release APK
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${RELEASE_KEYSTORE_BASE64:?Set the RELEASE_KEYSTORE_BASE64 repository secret}"
          : "${RELEASE_STORE_PASSWORD:?Set the RELEASE_STORE_PASSWORD repository secret}"
          : "${RELEASE_KEY_ALIAS:?Set the RELEASE_KEY_ALIAS repository secret}"
          : "${RELEASE_KEY_PASSWORD:?Set the RELEASE_KEY_PASSWORD repository secret}"

          umask 077
          keystore="$(mktemp "$RUNNER_TEMP/tepco-release.XXXXXXXX.jks")"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          unset RELEASE_KEYSTORE_BASE64

          gradle --no-daemon :app:assembleRelease \
            "-Pandroid.injected.signing.store.file=$keystore" \
            "-Pandroid.injected.signing.store.password=$RELEASE_STORE_PASSWORD" \
            "-Pandroid.injected.signing.key.alias=$RELEASE_KEY_ALIAS" \
            "-Pandroid.injected.signing.key.password=$RELEASE_KEY_PASSWORD"

          sdk_dir="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          apksigner="$(find "${sdk_dir:?Android SDK path is missing}/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -x "$apksigner"
          "$apksigner" verify app/build/outputs/apk/release/app-release.apk
      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Tehran-Air-TEPCO-Release-APK-v3
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
